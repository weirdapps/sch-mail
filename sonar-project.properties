sonar.organization=weirdapps
sonar.projectKey=weirdapps_sch-mail
sonar.projectName=sch-mail

sonar.sources=.
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Written by pytest-cov in the SonarCloud workflow. Unset, Sonar looks for
# coverage-reports/*coverage-*.xml instead and imports nothing.
sonar.python.coverage.reportPaths=coverage.xml

# .github/** is excluded on evidence, not taste: YAML was billing 3,362
# ncloc across the org and had produced exactly zero issues in any of the
# thirteen projects. On the free plan's 50,000-line ceiling that is 7% of
# the budget for no findings. Re-include it if Sonar's Actions rules ever
# grow teeth. coverage.xml is excluded for the same budget: with
# sonar.sources=. the report the job writes would be indexed as XML source.
sonar.exclusions=\
  .github/**,\
  **/tests/**,\
  **/.venv/**,\
  **/__pycache__/**,\
  coverage.xml,\
  **/coverage.xml
