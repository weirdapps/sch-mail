version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    allow:
      - dependency-type: "direct"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # github/codeql-action/init and /analyze must stay on the same version,
      # or the run fails with "Loaded a configuration file for version X, but
      # running version Y". One group keeps them in one PR.
      codeql-action:
        patterns:
          - "github/codeql-action*"
