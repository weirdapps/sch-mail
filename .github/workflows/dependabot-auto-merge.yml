name: Dependabot auto-merge
'on': pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # Shared implementation. It tries native `gh pr merge --auto` first and,
    # where that is unavailable (it needs the repository's auto-merge setting
    # and a branch-protection rule), polls this PR's own checks and merges once
    # they are green. Majors stay open for review.
    # weirdapps/shared-workflows dependabot-auto-merge.yml @main as of 2026-08-17
    # yamllint disable-line rule:line-length
    uses: weirdapps/shared-workflows/.github/workflows/dependabot-auto-merge.yml@d6d3dd962e803eaeb56330fff30db2757a996990
