name: SonarCloud Analysis

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Minimal token scope. Added 2026-09-20: this workflow had no
# permissions: key, so GITHUB_TOKEN arrived with the repository default,
# which can grant write across contents, issues, pull-requests and more.
# Read-only here; the sonarcloud job below adds the one write it needs.
permissions:
  contents: read

jobs:
  tests:
    # This job runs the code under review, so it holds no secret and can only
    # read. SONAR_TOKEN goes to the sonarcloud job, which runs nothing from the
    # checkout and receives the coverage report as an artifact.
    name: Tests with coverage
    runs-on: ubuntu-latest
    outputs:
      has_tests: ${{ steps.check-tests.outputs.has_tests }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: '3.13'

      # From uv.lock (hash-pinned), not a fresh resolve from PyPI. pytest-cov is
      # not in the lock, so it is pinned by version.
      - name: Install dependencies (uv.lock, frozen)
        continue-on-error: true
        run: |
          python -m pip install uv==0.12.21
          uv sync --extra dev --frozen
          uv pip install pytest-cov==7.1.0

      - name: Check for tests
        id: check-tests
        run: |
          if [ -d tests ]; then
            echo "has_tests=true" >> $GITHUB_OUTPUT
          else
            echo "has_tests=false" >> $GITHUB_OUTPUT
            echo "::notice::No tests directory found — SonarCloud will scan without coverage"
          fi

      - name: Run tests with coverage
        if: steps.check-tests.outputs.has_tests == 'true'
        continue-on-error: true
        # --cov must name code that exists. This said `--cov=src` and there is
        # no src/ here: the code is the single module server.py. pytest-cov
        # measured nothing, wrote no coverage.xml, and the `|| true` swallowed
        # it, so SonarCloud showed no coverage while the job stayed green.
        # `|| true` stays so a failing test, which ci.yml already reports, does
        # not also block the scan; the next step fails the job when the report
        # itself is missing or measured nothing.
        run: .venv/bin/pytest --cov=server --cov-report=xml --cov-report=term-missing || true

      - name: Fail if coverage measured nothing
        if: steps.check-tests.outputs.has_tests == 'true'
        run: |
          if [ ! -s coverage.xml ] || grep -q 'lines-valid="0"' coverage.xml; then
            echo "::error::coverage.xml is missing or measured nothing: --cov must name code that exists"
            exit 1
          fi

      - name: Upload coverage report
        if: steps.check-tests.outputs.has_tests == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  sonarcloud:
    # No private-repo gate: analysis runs on every push and pull request.
    name: SonarCloud
    needs: tests
    runs-on: ubuntu-latest
    # pull-requests: write is kept on purpose: the SonarCloud action uses
    # GITHUB_TOKEN to decorate the pull request, and that is the one write
    # this job legitimately performs. contents stays read.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0  # Full history for SonarCloud blame
          persist-credentials: false

      - name: Download coverage report
        if: needs.tests.outputs.has_tests == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: coverage

      - name: Check for SonarCloud token
        id: check-sonar
        # Through env:, so the secret is never expanded into the script text.
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "has_token=true" >> $GITHUB_OUTPUT
          else
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "::notice::SONAR_TOKEN not configured — skipping SonarCloud scan"
          fi

      - name: SonarCloud Scan
        if: steps.check-sonar.outputs.has_token == 'true'
        # The scanner action itself, pinned by commit. The deprecated
        # sonarcloud-github-action wrapper pulled an older release of it, and
        # actions/cache inside that, by moving tags. This release is one
        # JavaScript action that pulls no other action.
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4  # v8.2.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Fail if the server-side analysis failed
        # The scanner exits 0 the moment the report finishes uploading. Anything
        # that rejects the analysis afterwards happens in SonarCloud's Compute
        # Engine, which this job never looked at, so it went green while nothing
        # was measured. A project can stay broken that way from its creation with
        # every run reporting success, and the free plan's 50,000-line org
        # ceiling can take every repo down at once without producing a single
        # red build anywhere.
        if: steps.check-sonar.outputs.has_token == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          report=.scannerwork/report-task.txt
          if [ ! -f "$report" ]; then
            echo "::error::$report is missing, so the analysis cannot be confirmed"
            exit 1
          fi
          task_url=$(sed -n 's/^ceTaskUrl=//p' "$report")
          for _ in $(seq 1 60); do
            body=$(curl -sS -u "${SONAR_TOKEN}:" "$task_url" || true)
            status=$(printf '%s' "$body" | jq -r '.task.status' 2>/dev/null || echo RETRY)
            case "$status" in
              SUCCESS)
                echo "Analysis completed server-side."
                exit 0
                ;;
              FAILED|CANCELED)
                msg=$(printf '%s' "$body" | jq -r '.task.errorMessage // "no message"')
                echo "::error::SonarCloud analysis $status: $msg"
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "::error::Timed out after 5 minutes waiting for the SonarCloud analysis task"
          exit 1
